name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-apps:
    name: Discover applications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List buildable applications
        id: apps
        run: |
          apps=$(scripts/list-apps.sh --json)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-01
          components: rust-src,rustfmt,clippy
      - name: Run host tests
        run: scripts/test.sh
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  firmware:
    name: ESP-IDF 5.5.3 / ESP32-C3 / ${{ matrix.app }}
    needs: discover-apps
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover-apps.outputs.apps) }}
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
      - name: Restore managed components
        uses: actions/cache@v6
        with:
          path: managed_components
          key: managed-components-idf-5.5.3-${{ hashFiles('dependencies.lock') }}
      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          scripts/build-app.sh "${{ matrix.app }}" build
      - name: Package firmware
        id: package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" >/dev/null
          version="$(git describe --tags --always --dirty)"
          scripts/package-firmware.sh "${{ matrix.app }}" "build/${{ matrix.app }}" "dist/${{ matrix.app }}" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.app }}-${{ steps.package.outputs.version }}
          path: dist/${{ matrix.app }}/
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run host tests
        run: scripts/test.sh
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  firmware:
    name: ESP-IDF 5.5.3 / ESP32-C3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: espressif/idf:v5.5.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-components-idf-5.5.3-${{ hashFiles('dependencies.lock') }}
      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py build
      - name: Package firmware
        id: package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" >/dev/null
          version="$(git describe --tags --always --dirty)"
          scripts/package-firmware.sh build dist "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

name: Release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build release firmware
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: espressif/idf:v5.5.3
    outputs:
      app: ${{ steps.release.outputs.app }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
      - name: Restore managed components
        uses: actions/cache@v6
        with:
          path: managed_components
          key: managed-components-idf-5.5.3-${{ hashFiles('dependencies.lock') }}
      - name: Resolve application from tag
        id: release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          app="${tag%%/v*}"
          version="${tag#*/}"
          if [[ "$tag" != "$app/$version" ]] || ! scripts/list-apps.sh | grep -Fxq "$app"; then
            echo "Release tag must be <app>/v<version> for a buildable application" >&2
            exit 2
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and package
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          scripts/build-app.sh "${{ steps.release.outputs.app }}" build
          scripts/package-firmware.sh \
            "${{ steps.release.outputs.app }}" \
            "build/${{ steps.release.outputs.app }}" \
            "dist/${{ steps.release.outputs.app }}" \
            "${{ steps.release.outputs.version }}"
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.release.outputs.app }}-${{ steps.release.outputs.version }}
          path: dist/${{ steps.release.outputs.app }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository for tag verification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.app }}-${{ needs.build.outputs.version }}
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

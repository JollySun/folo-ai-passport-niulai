name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include button interactions and expected screen/audio behavior.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Hardware or compatibility constraints
      placeholder: Flash, RAM, audio, battery, or board-revision considerations
